name: Despliegue Backend a cPanel HostGator

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sincronizar Backend con HostGator
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código desde GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sincronizar Código del Backend por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /backend/
          local-dir: ./backend/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/vendor/**
            **/storage/**
            **/storage/logs/**
            **/tests/**
            **/node_modules/**
            **/backendProduction/**
            **/production_database.sql
            **/*.sqlite
            **/*.sqlite-*
